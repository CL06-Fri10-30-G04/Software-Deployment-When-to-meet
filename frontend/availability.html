<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Availability</title>
    <script type="module" src="./js/availability.js"></script>
  </head>
  <body>
    <main>
      <h1>Availability</h1>

      <section>
        <h2>Weekly availability</h2>
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Available</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Sunday</td>
              <td><input type="checkbox" data-testid="avail-day-0-enabled" /></td>
              <td><input type="time" data-testid="avail-day-0-start" /></td>
              <td><input type="time" data-testid="avail-day-0-end" /></td>
            </tr>
            <tr>
              <td>Monday</td>
              <td><input type="checkbox" data-testid="avail-day-1-enabled" /></td>
              <td><input type="time" data-testid="avail-day-1-start" /></td>
              <td><input type="time" data-testid="avail-day-1-end" /></td>
            </tr>
            <tr>
              <td>Tuesday</td>
              <td><input type="checkbox" data-testid="avail-day-2-enabled" /></td>
              <td><input type="time" data-testid="avail-day-2-start" /></td>
              <td><input type="time" data-testid="avail-day-2-end" /></td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td><input type="checkbox" data-testid="avail-day-3-enabled" /></td>
              <td><input type="time" data-testid="avail-day-3-start" /></td>
              <td><input type="time" data-testid="avail-day-3-end" /></td>
            </tr>
            <tr>
              <td>Thursday</td>
              <td><input type="checkbox" data-testid="avail-day-4-enabled" /></td>
              <td><input type="time" data-testid="avail-day-4-start" /></td>
              <td><input type="time" data-testid="avail-day-4-end" /></td>
            </tr>
            <tr>
              <td>Friday</td>
              <td><input type="checkbox" data-testid="avail-day-5-enabled" /></td>
              <td><input type="time" data-testid="avail-day-5-start" /></td>
              <td><input type="time" data-testid="avail-day-5-end" /></td>
            </tr>
            <tr>
              <td>Saturday</td>
              <td><input type="checkbox" data-testid="avail-day-6-enabled" /></td>
              <td><input type="time" data-testid="avail-day-6-start" /></td>
              <td><input type="time" data-testid="avail-day-6-end" /></td>
            </tr>
          </tbody>
        </table>
        <button type="button" data-testid="avail-save">Save</button>
        <p aria-live="polite" data-testid="avail-status"></p>
      </section>

      <section>
        <h2>Add unavailability</h2>
        <form id="unavailability-form">
          <div>
            <label for="unavail-label">Label</label>
            <input id="unavail-label" data-testid="unavail-label" name="label" type="text" required />
          </div>

          <fieldset>
            <legend>Type</legend>
            <label>
              <input type="radio" name="unavail-type" value="once" data-testid="unavail-type-once" checked />
              One-off
            </label>
            <label>
              <input type="radio" name="unavail-type" value="recurring" data-testid="unavail-type-recurring" />
              Recurring
            </label>
          </fieldset>

          <div id="unavail-once-fields">
            <div>
              <label for="unavail-once-start">Start</label>
              <input id="unavail-once-start" name="once-start" type="datetime-local" />
            </div>
            <div>
              <label for="unavail-once-end">End</label>
              <input id="unavail-once-end" name="once-end" type="datetime-local" />
            </div>
          </div>

          <div id="unavail-recurring-fields" hidden>
            <fieldset>
              <legend>Days</legend>
              <label><input type="checkbox" name="recurring-day" value="0" /> Sunday</label>
              <label><input type="checkbox" name="recurring-day" value="1" /> Monday</label>
              <label><input type="checkbox" name="recurring-day" value="2" /> Tuesday</label>
              <label><input type="checkbox" name="recurring-day" value="3" /> Wednesday</label>
              <label><input type="checkbox" name="recurring-day" value="4" /> Thursday</label>
              <label><input type="checkbox" name="recurring-day" value="5" /> Friday</label>
              <label><input type="checkbox" name="recurring-day" value="6" /> Saturday</label>
            </fieldset>
            <div>
              <label for="unavail-recurring-start">Start time</label>
              <input id="unavail-recurring-start" name="recurring-start" type="time" />
            </div>
            <div>
              <label for="unavail-recurring-end">End time</label>
              <input id="unavail-recurring-end" name="recurring-end" type="time" />
            </div>
            <div>
              <label for="unavail-recurring-until">Recurs until</label>
              <input id="unavail-recurring-until" name="recurring-until" type="date" />
            </div>
          </div>

          <button type="submit" data-testid="unavail-add">Add unavailability</button>
          <p role="alert" data-testid="form-error" hidden></p>
        </form>
      </section>

      <section>
        <h2>Existing unavailability</h2>
        <ul data-testid="unavail-list"></ul>
      </section>
    </main>
  </body>
</html>
