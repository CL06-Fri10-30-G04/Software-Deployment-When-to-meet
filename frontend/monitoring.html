<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/monitoring.js"></script>
  </head>
  <body>
    <main class="monitoring">
      <section class="card">
        <h1>Monitoring</h1>
        <p class="monitoring-intro">
          CPU, memory, disk I/O, network traffic and HTTP request latency, measured inside the
          container that answered this page.
        </p>
        <p role="alert" hidden data-testid="monitoring-error"></p>
      </section>

      <section class="card monitoring-section" aria-labelledby="live-heading" data-testid="live-section">
        <div class="monitoring-section-head">
          <h2 id="live-heading">Container monitoring</h2>
          <div class="monitoring-controls">
            <label class="monitoring-toggle">
              <input type="checkbox" id="live-auto-refresh" checked />
              Refresh every 5 seconds
            </label>
            <span class="monitoring-updated" id="live-updated" aria-live="polite"></span>
          </div>
        </div>
        <div class="stat-tiles" id="live-tiles"></div>
        <div class="chart-grid" id="live-charts"></div>
        <h3>Requests by route, last 15 minutes</h3>
        <div class="monitoring-table" id="live-routes"></div>
      </section>
    </main>
  </body>
</html>
