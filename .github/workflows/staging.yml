name: Staging CI/CD

on:
  pull_request:
    branches: ["staging"]

  push:
    branches: ["staging"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run frontend tests
        run: python -m pytest tests/frontend -v

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Run backend unit tests
        run: python -m pytest tests/backend tests/unit -v

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      cosmos-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
          - 8081:8081
        env:
          ENABLE_TELEMETRY: "false"

    env:
      COSMOS_ENDPOINT: http://127.0.0.1:8081
      # Microsoft's published emulator key, the same for everyone. Not a secret.
      COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      COSMOS_VERIFY_SSL: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Wait for Cosmos DB emulator
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ || true)
            if [ "$status" != "000" ] && [ "$status" != "503" ]; then
              echo "Emulator ready (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "Emulator did not become ready in 2 minutes"
          exit 1

      - name: Run integration tests
        run: python -m pytest tests/integration -v

  build-staging:
    name: Build and publish staging image
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - backend-tests
      - integration-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image details
        id: image
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')/whentomeetbutbetter"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: docker build -t "$IMAGE:$TAG" .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE:$TAG"


  deploy-staging:
    name: Deploy to Azure staging
    runs-on: ubuntu-latest

    needs: build-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy staging container app
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.AZURE_STAGING_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/cl06-fri10-30-g04/whentomeetbutbetter:${{ github.sha }}
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}

      - name: Verify deployment
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          set -e

          if [ -z "$HEALTH_URL" ]; then
            echo "STAGING_HEALTH_URL is not configured."
            exit 1
          fi

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo "Staging health check passed."
              exit 0
            fi

            echo "Waiting for staging application... ($attempt/18)"
            sleep 10
          done

          echo "Staging health check failed."
          exit 1
