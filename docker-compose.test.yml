services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      ENABLE_TELEMETRY: "false"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COSMOS_ENDPOINT: http://cosmos-emulator:8081
      COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      COSMOS_DB_NAME: when_to_meet
      COSMOS_VERIFY_SSL: "false"
      SESSION_SECRET: test-session-secret
    depends_on:
      cosmos-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      COSMOS_ENDPOINT: http://cosmos-emulator:8081
      COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      COSMOS_DB_NAME: when_to_meet_test
      COSMOS_VERIFY_SSL: "false"
      SESSION_SECRET: test-session-secret
      BASE_URL: http://app:8000
    command: python -m pytest tests/backend tests/unit tests/integration tests/frontend -v
    depends_on:
      cosmos-emulator:
        condition: service_healthy
      app:
        condition: service_healthy
