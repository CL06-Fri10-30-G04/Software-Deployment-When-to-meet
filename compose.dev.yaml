services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: test_database
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests/test_database.sql:/docker-entrypoint-initdb.d/02-dummy-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: test_database
      DB_USER: test
      DB_PASSWORD: test
    depends_on:
      db:
        condition: service_healthy