services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: test_database
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests/test_database.sql:/docker-entrypoint-initdb.d/02-dummy-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      DB_NAME: test_database
      DB_USER: test
      DB_PASSWORD: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      DB_NAME: test_database
      DB_USER: test
      DB_PASSWORD: test
      BASE_URL: http://app:8000
    command: python -m pytest tests/backend tests/integration tests/frontend -v
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy